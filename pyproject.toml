[project]
name = "receivers"
version = "0.1.0"
description = "GPS/GNSS receiver management and data download toolkit for Veðurstofa Íslands"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Benedikt Gunnar Ófeigsson", email = "bgo@vedur.is" },
    { name = "Fjalar Sigurdsson", email = "fjalar@vedur.is" },
]
maintainers = [
    { name = "Benedikt Gunnar Ófeigsson", email = "bgo@vedur.is" }
]
keywords = [
    "gps", "gnss", "receivers", "septentrio", "polarx5", "data-download", 
    "station-health", "ftp", "rinex", "geodesy", "geophysics",
    "vedurstofan", "iceland", "met-office"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Environment :: Console",
    "Natural Language :: English",
]
requires-python = ">=3.13"
dependencies = [
    "python-dateutil>=2.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0.0",
    "apscheduler>=3.10.0",
    "paramiko>=3.0.0",
    "sqlalchemy>=2.0.0",
    # psutil is NOT optional: the systemd unit's ExecStop runs
    # `receivers scheduler stop`, whose only mechanism for finding and
    # signalling the running scheduler is psutil.process_iter. It was declared
    # solely in the [scheduler] extra, which `pip install -e .` (what
    # install.sh runs) does not install — so on rek-d01 the stop hit
    # `except ImportError: return 1` instantly, systemd waited out its full
    # 2-minute TimeoutStopSec, then SIGKILLed a scheduler that was mid-RINEX
    # conversion at 1.9 GB. apscheduler and sqlalchemy were promoted out of
    # that same extra; psutil was simply missed.
    "psutil>=5.9.0",
    "psycopg2-binary>=2.9.0",
    "gtimes @ git+https://github.com/bgo-gnss/gtimes@v0.5.1",
    # tostools master @a5f1b7d: MUST NOT stay at @668964b. That commit carries
    # tostools d467807 (F1 step 2 widened the default attribute list) WITHOUT
    # its fix 8fa822c, so deploying it puts a regression into `--fix-headers`:
    # the era-resolution chain (gps_metadata -> get_device_sessions) splits on
    # constellation boundaries, a mid-tenure toggle can drop the earlier window,
    # and corrector then falls back to device_history[-1] — the most RECENT
    # equipment — writing the wrong era into a historical RINEX header, silently.
    # Also brings GAMIT station.info back off that split, and makes site-log §12
    # publish a dialable "+354 " phone. Earlier: @668964b R2 'M' (mixed) ->
    # GPS+GLO constellation probe; @ea5e2d5 require azimuth for closed-join
    # antennas installed after 2011 (true-north assumed); @f42dee4 station
    # verify/triage --include-closed audits historical (closed-join) devices;
    # @c9181aa sitelog reads the TOS tectonic_plate attribute; @bdc8a52 adds
    # TRM115000.00 (Zephyr 3 Geodetic) to ANTENNA_IGS — blocks NPSK. Bumping is
    # mandatory, not cosmetic — the laptop mamba env has tostools editable, so
    # an unbumped pin fails only in CI / on rek-d01.
    #
    # NOTE the tostools version is still 0.6.1, so this is a SAME-VERSION SHA
    # bump: pip will not re-fetch a direct-URL dep whose installed version
    # already satisfies it. It takes effect only via install.sh's uninstall
    # step — a plain `pip install -e .` on rek-d01 will silently keep the old
    # SHA. The targeted alternative, which avoids install.sh's destructive
    # whole-tree uninstall entirely:
    #   venv/bin/pip install --force-reinstall --no-deps \
    #     'tostools @ git+https://github.com/bgo-gnss/tostools@<sha>'
    #
    # @c9bd76b (2026-08-25) — 23 commits on from a5f1b7d. rek-d01 was that far
    # behind, so this is the first bump carrying any of it:
    #   * the ATTRIBUTE CATALOG now describes TOS — `tos audit
    #     attribute-catalog` goes from 53 phantoms / 15 unlisted to CLEAN.
    #     Includes dcb58f6's GPS-slice fix, without which `tosGPS search
    #     'date_end != null'` disagrees with `--discontinued` (#156) because
    #     the catalog called that attribute `close_date`, a name TOS does not
    #     define. That divergence is live on rek-d01 until this lands.
    #   * `tos search` is the entity layer (81e4e86) — no silent GPS subtype
    #     pin, so 217 -> 443 entities.
    #   * search selectors: visit.* (42d01f2), contact.* + --owner (2fa27d9),
    #     agency-abbreviation resolution (dfd1c3a), fleet-wide `visit search`.
    #   * `tos search` validates attribute codes (a typo used to ANSWER rather
    #     than error: 'typo = null' matched the whole fleet).
    #
    # @bdf093c (2026-08-27) — 22 commits on from c9bd76b:
    #   * PUBLIC NAMES for the three symbols this package used to reach for
    #     through an underscore (390ffad): `load_password_from_pass`,
    #     `format_known_models`, `parse_daily_rinex_date`. The private names
    #     are still there as the alias targets, so this bump is not required
    #     for the imports to work — but the imports here now use the public
    #     ones, so a later tostools release that drops the underscores is a
    #     non-event instead of an outage.
    #   * F1 COMPLETE (8f1b44e): `legacy/gps_metadata_qc.py` deleted, 994 L.
    #     The live site-log renderer no longer routes through a fork copy.
    #   * library code raises `TOSConnectionError` instead of `sys.exit(1)`
    #     (111f9f0) — review item 6. An import-time `sys.exit` in a library
    #     killed the CALLER; 11 importers were exposed.
    #   * lazy package re-exports, PEP 562 (58e508d): `import tostools`
    #     ~0.6s -> 0.018s, and the cheap paths no longer drag in
    #     pandas/numpy/requests/pyproj.
    #   * deterministic marker-typo verdict for MARKER NAME mismatches
    #     (918e871) + the current device session merged into the rinex verdict
    #     (504e2ab), so the marker check uses the receiver serial.
    #
    # @0e57e3e — build_site_log threads pre-fetched metadata (station_metadata /
    # device_sessions) down to the renderer. Without it `client` was injectable
    # at one layer while the layer below still did its own live TOS fetch, so
    # receivers' site-log tests passed ONLY by reaching production TOS. Also
    # carries a1fe59c (marker lookup via /entity/search/, not basic_search).
    #
    # @6e0e259 (2026-08-29) — F2 COMPLETE: the legacy/top-level fork is closed,
    # so `gps_metadata_functions` no longer has two implementations of anything.
    # Low risk FOR THIS PACKAGE and worth bumping anyway:
    #   * THE PUBLISHED SITE LOG IS BYTE-IDENTICAL, and that is proven rather
    #     than asserted — `tests/test_sitelog_oracle.py` byte-locks
    #     `build_site_log` (the entry point this package's
    #     `dissemination/sitelogs.py` calls) for RHOF/AUST/ISAK/VMEY plus the
    #     M3G publish argument shape, and it passes unchanged across F2. It
    #     also covers the 0e57e3e threading seam above, which nothing tested.
    #   * top-level `site_log` / `print_station_info` are now delegators onto
    #     the live legacy copies (−814 L). Neither had any caller here.
    #   * `print_station_history` unified the OTHER way — its live copy was the
    #     broken one: `tos PrintTOS <sid> --format table` exited 1 for 8/8
    #     stations. Not a path this package takes, but it is a real tosGPS fix
    #     for anyone on rek-d01. Contact-table language is now `--lang {is,en}`,
    #     defaulting to the pre-existing Icelandic.
    #   * `device_attribute_history` no longer iterates an unordered set, which
    #     made its output PYTHONHASHSEED-dependent. This one DOES touch shared
    #     ground — that function feeds `cfg reconcile` and the era-resolution
    #     chain — but published site logs were provably unaffected (that
    #     renderer sorts sessions itself), which the oracle above confirms.
    #   * `scripts/export_station_equipment.py` un-broken (F1 collateral).
    # Verified cross-package before bumping: receivers 3383 passed / 0 failed
    # against this SHA via the editable mamba env.
    "tostools @ git+https://github.com/bgo-gnss/tostools@1b8f05d",
    # gps_parser main @257a2ee: passive-station schema (2c5b428) + canonical
    # module-level parse_station_role (257a2ee) — the API config_utils imports.
    "gps-parser @ git+https://github.com/bgo-gnss/gps_parser@257a2ee",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0", 
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "bandit>=1.7.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0", 
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
local = [
    "gtimes>=0.4.0",  # Local package - install separately
    # "gps_parser",   # Local package - install separately
]
scheduler = [
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
    "psutil>=5.9.0",  # For scheduler stop/restart commands
]
all = [
    "receivers[dev,test,docs,local,scheduler]",
]

[project.urls]
Homepage = "https://github.com/vedur-is/receivers"
Repository = "https://github.com/vedur-is/receivers"
Issues = "https://github.com/vedur-is/receivers/issues"
Documentation = "https://vedur-is.github.io/receivers"

[project.scripts]
receivers = "receivers.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/receivers"]

# Dev-only sibling overrides: when these paths exist locally, `uv sync`
# installs them as editable instead of pulling the git+https pins above.
# [tool.uv.sources] is ignored by built wheels and by consumers without
# local sibling checkouts, so production deploys still resolve git+https.
# Avoids the symlink-vs-git+https collision that wiped tostools/src/
# during a `uv lock` on 2026-05-24 (the venv had a manually-created
# editable symlink that uv unlinked along with its target).
[tool.uv.sources]
gtimes = { path = "../gtimes", editable = true }
tostools = { path = "../tostools", editable = true }
gps-parser = { path = "../gps_parser", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "N803",  # argument name should be lowercase (GPS functions use camelCase)
    "N806",  # variable in function should be lowercase (legacy GPS code)
    "B904",  # Within except clause, raise exceptions with raise ... from err
    "F401",  # imported but unused (needed for conditional imports)
    "E402",  # module-level import not at top of file (intentional lazy imports for optional deps)
    "E722",  # bare except (pragmatic in legacy receiver code)
    "E741",  # ambiguous variable name (single-letter math/physics variables are idiomatic)
    "N814",  # CamelCase imported as constant (backward-compat re-exports)
    "B007",  # unused loop control variable (often intentional)
    "B017",  # assert-raises exception (tests assert broad exception intentionally)
    "B023",  # function uses loop variable (legacy pattern)
    "UP006", # non-pep585 annotation (List/Dict/Tuple — mixed with py585 `list[...]` in codebase)
    "UP007", # non-pep604 union annotation (Optional/Union — style preference)
    "UP035", # deprecated import (typing.List/Dict/Tuple not deprecated on py3.9)
    "UP045", # non-pep604 Optional annotation (Optional[X] vs X | None — style preference)
    "B905",  # zip without explicit strict= (legacy pattern, safe when lengths are pre-validated)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N802", "N803"]  # Allow uppercase in test names

[tool.bandit]
# False positives / out-of-scope for this codebase:
# - FTP is the required protocol for GPS receivers
# - URLs are always internal (receiver IPs, internal config endpoints)
# - tarfile archives come from receivers we control
# - SQL is parameterised through SQLAlchemy wrappers
# - XML is parsed from receiver responses we control
# - tmp paths are sanitized by callers
skips = [
    "B108",  # hardcoded_tmp_directory
    "B202",  # tarfile_unsafe_members (archives come from controlled sources)
    "B310",  # urllib.request.urlopen (URLs are internal only)
    "B314",  # xml.etree.ElementTree (untrusted-XML not in threat model)
    "B321",  # FTP-related function calls
    "B402",  # FTP-related module imports
    "B608",  # hardcoded_sql_expressions (all SQL is parameterised)
]

[tool.black]
line-length = 88
target-version = ['py312', 'py313']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "progressbar2.*",
    "gps_parser.*",
    "tostools.*",
    "psycopg2.*",
    "pyproj.*",
    "gtimes.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config", 
    "-ra",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests with receivers",
    "ftp: Tests requiring FTP connections",
    "slow: Slow tests that may take time",
    "septentrio: Septentrio-specific tests",
    "polarx5: PolaRX5 receiver tests",
    "scheduler: Scheduler-related tests",
    "concurrent: Tests for concurrent operations",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2